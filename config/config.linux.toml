[tools]
java = "lts"
python = "latest"
usage = "latest"
starship = "latest"
rust = "latest"

[tasks.cleanup]
run = "./scripts/cleanup.sh"

[bootstrap.user]
login_shell = "zsh"

[bootstrap.packages]
"dnf:nvim" = "latest"
"dnf:zsh" = "latest"
"dnf:fzf" = "latest"
"dnf:zoxide" = "latest"
"dnf:eza" = "latest"
"dnf:fd" = "latest"
"dnf:git-delta" = "latest"

[bootstrap.hooks.pre-packages]
run = "sudo ./scripts/fttd.sh"

[bootstrap.services.firewalld]
state = "stopped"
enabled = false
masked = true

[bootstrap.services.nftables]
state = "running"
enabled = true

[bootstrap.linux.firewall]
backend = "nftables"
default_incoming = "deny"
default_outgoing = "allow"

[[bootstrap.linux.firewall.rules]]
name = "https"
port = 443
protocol = "tcp"
