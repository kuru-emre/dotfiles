[tools]
java = "lts"
python = "latest"
usage = "latest"
starship = "latest"

[bootstrap.user]
login_shell = "zsh"

[bootstrap.packages]
"dnf:nvim" = "latest"
"dnf:zsh" = "latest"
"dnf:fzf" = "latest"
"dnf:zoxide" = "latest"
"dnf:eza" = "latest"
"dnf:fd" = "latest"
"dnf:git-delta" = "latest"

[bootstrap.hooks.pre-packages]
run = "sudo ./fttd.sh"

[bootstrap.services.firewalld]
state = "stopped"
enabled = false
masked = true

[bootstrap.services.nftables]
state = "running"
enabled = true

[bootstrap.linux.firewall]
backend = "nftables"
default_incoming = "deny"
default_outgoing = "allow"

[[bootstrap.linux.firewall.rules]]
name = "https"
port = 443
protocol = "tcp"

[[bootstrap.linux.firewall.rules]]
name = "ssh"
port = 22
protocol = "tcp"
interface = "wt0"

[[bootstrap.linux.firewall.rules]]
name = "libvirt-dhcp"
port = 67
protocol = "udp"
interface = "virbr0"

[[bootstrap.linux.firewall.rules]]
name = "libvirt-dns-udp"
port = 53
protocol = "udp"
interface = "virbr0"

[[bootstrap.linux.firewall.rules]]
name = "libvirt-dns-tcp"
port = 53
protocol = "tcp"
interface = "virbr0"
