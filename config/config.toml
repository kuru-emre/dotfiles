[settings]
trusted_config_paths = ["~"]

[settings.self_update]
auto = true

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.config/git" = { mode = "track" }
"~/.config/mise" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/starship" = { mode = "track" }
"~/.config/zsh" = { mode = "track" }
"~/.zshenv/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"' }
