[vars]
repos_dir = "~/Repos"

[settings]
trusted_config_paths = ["~/.config", "{{ vars.repos_dir }}"]
experimental = true

[settings.self_update]
auto = true

[history.encryption]
recipients = [
  "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItvNwSKWUEMOpWH9djUG0A1/pMelKJflG0FT58J6Ltb mise",
]

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.repos]
"{{ vars.repos_dir }}/portfolio" = { url = "git@github.com:kuru-emre/portfolio" }

[bootstrap.hooks.post-dotfiles]
run = "mise run decrypt-age"

[dotfiles]
"~/.config/atuin" = { mode = "track" }
"~/.config/dankcal" = { mode = "track" }
"~/.config/dfiles" = { mode = "track" }
"~/.config/fontconfig" = { mode = "track" }
"~/.config/gh" = { mode = "track" }
"~/.config/git" = { mode = "track" }
"~/.config/keepassxc" = { mode = "track", encrypt = true }
"~/.config/kitty" = { mode = "track", include = ["kitty.conf"] }
"~/.config/lig" = { mode = "track" }
"~/.config/mise" = { mode = "track" }
"~/.config/niri/shortcuts.kdl" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/rclone" = { mode = "track", encrypt = true }
"~/.config/starship" = { mode = "track" }
"~/.config/zsh" = { mode = "track", exclude = ["*.zwc"] }
"~/.config/zsh-patina" = { mode = "track" }
"~/.local/share/wallpapers" = { mode = "track" }
"~/.ssh" = { mode = "track", exclude = ["agent", "known_hosts"] }
"~/.zshenv" = { mode = "track" }
