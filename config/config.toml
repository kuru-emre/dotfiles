[settings]
trusted_config_paths = ["~"]

[tools]
android-sdk = "latest"
bun = "latest"
java = "lts"
node = "latest"
python = "latest"
ruby = "latest"
rust = "latest"

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.mise_shell_activate]
zsh = true

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[bootstrap.packages]
"dnf:git" = "latest"
"dnf:nvim" = "latest"
"dnf:zsh" = "latest"
"dnf:docker" = "latest"

[dotfiles]
"~/.config/mise" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/starship" = { mode = "track" }
"~/.config/zsh" = { mode = "track" }
