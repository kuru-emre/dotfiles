[tools]
android-sdk = "latest"
bun = "latest"
node = "latest"
ruby = "latest"

[bootstrap.packages]
"dnf:papirus-icon-theme" = "latest"
"flatpak:com.brave.Browser" = "latest"

[bootstrap.hooks.post-packages]
run = [{ task = "fonts" }]

[tasks.fonts]
run = """
  git clone https://github.com/maximilionus/lucidglyph.git
  sudo ./lucidglyph/lucidglyph.sh install
  rm -rf ./lucidglyph
"""
