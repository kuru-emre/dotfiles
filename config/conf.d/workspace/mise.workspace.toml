[tools]
android-sdk = "latest"
bun = "latest"
node = "latest"

[bootstrap.packages]
"dnf:papirus-icon-theme" = "latest"

[bootstrap.files."/etc/yum.repos.d/vscode.repo"]
source = "./code.repo"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.hooks.pre-packages]
run = "sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc"
