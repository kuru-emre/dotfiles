[tools]
android-sdk = "latest"
bun = "latest"
node = "latest"

[bootstrap.dnf.repos]
nerd_fonts = { copr = "che/nerd-fonts" }

[bootstrap.packages]
"dnf:code" = "latest"
"dnf:papirus-icon-theme" = "latest"
"dnf:ibm-plex-mono-fonts" = "latest"

[bootstrap.files."/etc/yum.repos.d/vscode.repo"]
source = "./code.repo"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.hooks.pre-packages]
run = "sudo dnf config-manager addrepo --overwrite --from-repofile=/etc/yum.repos.d/vscode.repo"

[bootstrap.hooks.post-packages]
run = "sudo dnf remove @kde-pim @dial-up -y"
