[tools]
android-sdk = "latest"
bun = "latest"
node = "latest"
ruby = "latest"

[bootstrap.packages]
"dnf:papirus-icon-theme" = "latest"
"flatpak:com.brave.Browser" = "latest"

[bootstrap.files."/etc/yum.repos.d/vscode.repo"]
source = "./code.repo"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.hooks.pre-packages]
run = "sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc"

[bootstrap.hooks.post-packages]
run = """
  git clone https://github.com/maximilionus/lucidglyph.git
  sudo ./lucidglyph/lucidglyph.sh install
  rm -rf ./lucidglyph
"""
