[tools]
android-sdk = "latest"
bun = "latest"
node = "latest"
ruby = "latest"

[bootstrap.packages]
"dnf:papirus-icon-theme" = "latest"
"flatpak:com.brave.Browser" = "latest"

[bootstrap.hooks.post-packages]
run = """
  git clone https://github.com/maximilionus/lucidglyph.git
  cd lucidglyph
  sudo ./lucidglyph.sh install & rm -rf ./lucidglyph

"""
