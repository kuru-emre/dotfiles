[tools]
android-sdk = "latest"
bun = "latest"
node = "latest"


[bootstrap.packages]
"dnf:code" = "latest"
"dnf:papirus-icon-theme" = "latest"

[bootstrap.files."/etc/yum.repos.d/vscode.repo"]
source = "./code.repo"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.hooks.pre-packages]
run = "sudo dnf config-manager addrepo --from-repofile=/etc/yum.repos.d/vscode.repo"
