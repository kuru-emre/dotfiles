[env]
CRED_DIR = "{{ xdg_config_home }}/credstore.encrypted"

[tools]
bun = "latest"
node = "latest"

state = "present"

[bootstrap.services.rclone]
scope = "user"
enabled = true
command = 'rclone mount gdrive: "%h/Gdrive" --vfs-cache-mode full'
restart = "on-failure"

[bootstrap.services.keepassxc]
scope = "user"
enabled = true
command = '/bin/sh -c "systemd-creds --user --name="keepassxc-pw" decrypt \"%E/credstore.encrypted/keepassxc-pw\" - | keepassxc --pw-stdin \"%h/Gdrive/pswd.kdbx\""'
restart = "always"

[bootstrap.services.oo7-daemon]
scope = "user"
enabled = true
state = "running"

[bootstrap.services.ssh-agent]
scope = "user"
enabled = true
state = "running"

[bootstrap.packages]
"pacman:niri" = "latest"
"pacman:greetd" = "latest"
"pacman:oo7" = "latest"
"pacman:dux-shell" = "latest"
"pacman:dux-gop" = "latest"
"pacman:quickshell" = "latest"
"pacman:matugen" = "latest"
"pacman:cava" = "latest"
"pacman:khal" = "latest"

"pacman:kitty" = "latest"
"pacman:rclone" = "latest"
"pacman:keepassxc" = "latest"
"pacman:libreoffice" = "latest"
"pacman:adw-gtk-theme" = "latest"
"pacman:papirus-icon-theme" = "latest"
"pacman:ttf-noto-nerd" = "latest"

"aur:visual-studio-code-bin" = "latest"
"aur:brave-bin" = "latest"
"aur:dux-calendar-bin" = "latest"
"aur:dux-files-bin" = "latest"
"aur:dux-search-bin" = "latest"
"aur:dux-greeter-bin" = "latest"
"aur:gaze-bin" = "latest"

[tasks."setup-creds:oo7"]
description = "Initialize and verify oo7 keyring credential"
outputs = ["{{ env.CRED_DIR }}/oo7.keyring-encryption-password"]
run = [
  "systemd-ask-password -n 'oo7 Keyring Password' | systemd-creds --user --name=oo7.keyring-encryption-password encrypt - \"$CRED_DIR/oo7.keyring-encryption-password\"",
  "systemd-creds --user --name=oo7.keyring-encryption-password decrypt \"$CRED_DIR/oo7.keyring-encryption-password\" /dev/null",
  "echo '✓ Initialized and verified oo7.keyring-encryption-password'",
]

[tasks."setup-creds:keepassxc"]
description = "Initialize and verify KeePassXC database credential"
outputs = ["{{ env.CRED_DIR }}/keepassxc-pw"]
run = [
  "systemd-ask-password -n 'KeePassXC Database Password:' | systemd-creds --user --name=keepassxc-pw encrypt - \"$CRED_DIR/keepassxc-pw\"",
  "systemd-creds --user --name=keepassxc-pw decrypt \"$CRED_DIR/keepassxc-pw\" /dev/null",
  "echo '✓ Initialized and verified keepassxc-pw'",
]
