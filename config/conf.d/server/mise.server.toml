[bootstrap.files."/etc/hosts"]
source = "./hosts"
owner = "root"
group = "root"
mode = "0644"


[bootstrap.files."/etc/systemd/system/srv-data.mount"]
source = "./mounts/srv-data.mount"
owner = "root"
group = "root"
mode = "0644"

