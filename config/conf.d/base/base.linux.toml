[bootstrap.hooks.pre-packages]
run = "mise run setup-oo7 && mise run setup-keepassxc"

[bootstrap.packages]
"pacman:paru" = "latest"
"pacman:ouch" = "latest"
"pacman:nvim" = "latest"
"pacman:starship" = "latest"
"pacman:usage" = "latest"
"pacman:zsh" = "latest"
"pacman:fzf" = "latest"
"pacman:zoxide" = "latest"
"pacman:eza" = "latest"
"pacman:fd" = "latest"
"pacman:ripgrep" = "latest"
"pacman:bat" = "latest"
"pacman:tealdeer" = "latest"
"pacman:dust" = "latest"
"pacman:procs" = "latest"
"pacman:atuin" = "latest"
"pacman:git-delta" = "latest"
"pacman:openssh" = "latest"
"pacman:moor" = "latest"
"aur:netbird-bin" = "latest"
"aur:zsh-patina-bin" = "latest"
"aur:lig-bin" = "latest"

[bootstrap.services.oo7-daemon]
scope = "user"
enabled = true
state = "running"

[bootstrap.services.ssh-agent]
scope = "user"
enabled = true
state = "running"

[bootstrap.services."netbird@main"]
scope = "system"
enabled = true
state = "running"

[bootstrap.services.zsh-patina]
scope = "user"
enabled = true
command = "zsh-patina start --no-daemon"
state = "running"

[bootstrap.services.keepassxc]
scope = "user"
enabled = true
command = '/bin/sh -c "systemd-creds --user --name="keepassxc-pw" decrypt \"%E/credstore.encrypted/keepassxc-pw\" - | keepassxc --pw-stdin \"%h/Gdrive/pswd.kdbx\""'
restart = "always"

[bootstrap.linux.firewall]
backend = "nftables"
default_incoming = "deny"
default_outgoing = "allow"

[[bootstrap.linux.firewall.rules]]
name = "ssh"
port = 22
protocol = "tcp"
interface = "wt0"
