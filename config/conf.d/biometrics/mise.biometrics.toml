[bootstrap.packages]
"dnf:gaze" = "latest"
"dnf:gaze-kde" = "latest"

[bootstrap.files."/etc/yum.repos.d/gaze.repo"]
source = "./gaze.repo"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.hooks.pre-packages]
run = "sudo rpm --import https://packages.gundulabs.com/keys/gundulabs-repo.asc"

[bootstrap.hooks.post-packages]
run = ["sudo pam-config --add --gaze", "sudo pam-config --update", "sudo gaze-kde-pam enable", "sudo gaze-kde-pam enable-login"]
