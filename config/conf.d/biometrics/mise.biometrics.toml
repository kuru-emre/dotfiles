[bootstrap.packages]
"dnf:gaze" = "latest"
"dnf:gaze-kde" = "latest"

[bootstrap.files."/etc/yum.repos.d/gaze.repo"]
source = "./gaze.repo"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.hooks.pre-packages]
run = "sudo dnf config-manager addrepo --overwrite --from-repofile=/etc/yum.repos.d/gaze.repo"

[bootstrap.hooks.post-packages]
run = [
    "sudo authselect select gaze with-silent-lastlog --force", 
    "sudo authselect enable-feature with-face-retry", 
    "gaze keyring --kwallet", 
    "sudo gaze-kde-pam enable", 
    "sudo gaze-kde-pam enable-login"
]
