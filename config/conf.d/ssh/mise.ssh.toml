[bootstrap.packages]
"dnf:netbird" = "latest"

[bootstrap.files."/etc/yum.repos.d/netbird.repo"]
source = "./netbird.repo"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.hooks.pre-packages]
run = "sudo dnf config-manager addrepo --overwrite --from-repofile=/etc/yum.repos.d/netbird.repo"

[bootstrap.hooks.post-packages]
run = "netbird up"

[[bootstrap.linux.firewall.rules]]
name = "ssh"
port = 22
protocol = "tcp"
interface = "wt0"
